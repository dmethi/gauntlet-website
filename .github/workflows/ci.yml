name: CI

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` input on purpose. `packageManager` in the root
      # package.json is the single source of truth; declaring a version here
      # too makes action-setup@v4 fail with "Multiple versions of pnpm
      # specified" rather than pick one.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 18: @vitejs/plugin-react v5 is ESM-only and vitest.config.ts
          # loads it through require(), which only works on Node >= 22.12.
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build
