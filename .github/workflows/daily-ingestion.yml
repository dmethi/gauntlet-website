name: Daily Data Ingestion

on:
  schedule:
    # Daily at 8am ET during NFL season (September through January)
    - cron: '0 12 * 9-12 *' # Sep-Dec at 12:00 UTC (8am ET)
    - cron: '0 12 * 1 *'    # January at 12:00 UTC (8am ET)

  # Allow manual trigger
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  ingest-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install -w --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @gauntlet/server exec prisma generate

      - name: Run Daily Data Ingestion
        run: |
          echo "Running daily data ingestion for Gauntlet leagues..."
          pnpm --filter @gauntlet/server ingest:current

      - name: Verify Data Ingestion
        run: pnpm --filter @gauntlet/server inventory:db | head -30
