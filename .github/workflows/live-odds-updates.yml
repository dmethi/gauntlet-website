name: Live Odds Snapshots

on:
  schedule:
    # During NFL season (Sep-Feb): Every 10 minutes during game times
    # Covers EDT (UTC-4) and EST (UTC-5) throughout the season

    # Daily pre-game update: 6:00 AM ET
    - cron: "0 10 * 9-12,1-2 *" # Daily at 10:00 UTC during NFL season

    # Thursday Night Football: 8:00 PM - 11:30 PM ET
    # Runs Friday 00:00-05:59 UTC
    - cron: "*/10 0-5 * 9-12,1-2 5"

    # Friday Night Specials: International/holiday games
    # Runs Saturday 00:00-05:59 UTC
    - cron: "*/10 0-5 * 9-12,1-2 6"

    # Saturday Games: Late-season windows (Weeks 15-18)
    # Runs Saturday 17:00-23:59 UTC + Sunday 00:00-05:59 UTC
    - cron: "*/10 17-23 * 12,1 6" # Dec-Jan Saturdays
    - cron: "*/10 0-5 * 12,1 0" # Dec-Jan early Sunday (Saturday night carryover)

    # Sunday Early Window: 1:00 PM ET
    # Runs Sunday 17:00-21:59 UTC
    - cron: "*/10 17-21 * 9-12,1-2 0"

    # Sunday Late Window: 4:05/4:25 PM ET
    # Runs Sunday 20:00-23:59 UTC (overlaps with early, but that's fine)
    - cron: "*/10 20-23 * 9-12,1-2 0"

    # Sunday Night Football: 8:20 PM ET
    # Runs Monday 00:00-05:59 UTC
    - cron: "*/10 0-4 * 9-12,1-2 1"

    # Monday Night Football: 8:15 PM ET
    # Runs Tuesday 00:00-05:59 UTC
    - cron: "*/10 0-4 * 9-12,1-2 2"

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      week:
        description: "NFL Week to update (optional, defaults to current week)"
        required: false
        type: string
      force_live:
        description: "Force live game simulation (ignore game schedule)"
        required: false
        type: boolean
        default: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

concurrency:
  group: live-odds-snapshot
  cancel-in-progress: false # Let current snapshot complete before starting new one

jobs:
  update-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @gauntlet/server exec prisma generate --schema=prisma/schema-historical.prisma

      - name: Determine update type and week
        id: determine-context
        run: |
          WEEK="${{ github.event.inputs.week || '' }}"
          CURRENT_HOUR=$(date -u +%H)
          CURRENT_DAY=$(date -u +%u)
          CURRENT_MONTH=$(date -u +%m)
          FORCE_LIVE="${{ github.event.inputs.force_live || 'false' }}"

          IS_LIVE="false"
          TRIGGER_TYPE="scheduled"

          if [ "$FORCE_LIVE" = "true" ]; then
            IS_LIVE="true"
            TRIGGER_TYPE="manual-live"
          elif [ "$CURRENT_MONTH" -ge 9 ] || [ "$CURRENT_MONTH" -le 2 ]; then
            # Note: date +%u uses 1-7 (Mon-Sun), while cron uses 0-6 (Sun-Sat)
            # Expanded hours to cover both EDT (UTC-4) and EST (UTC-5)
            if [ "$CURRENT_DAY" = "2" ] && [ "$CURRENT_HOUR" -ge 0 ] && [ "$CURRENT_HOUR" -le 4 ]; then
              IS_LIVE="true"  # Tuesday 12-4 AM UTC = Monday 8-11 PM ET (EDT/EST)
            elif [ "$CURRENT_DAY" = "5" ] && [ "$CURRENT_HOUR" -ge 0 ] && [ "$CURRENT_HOUR" -le 4 ]; then
              IS_LIVE="true"  # Friday 12-4 AM UTC = Thursday 8-11 PM ET (EDT/EST)
            elif [ "$CURRENT_DAY" = "7" ] && [ "$CURRENT_HOUR" -ge 17 ]; then
              IS_LIVE="true"  # Sunday 5 PM - 11:59 PM UTC = Sunday 1-8 PM ET (EDT/EST)
            elif [ "$CURRENT_DAY" = "1" ] && [ "$CURRENT_HOUR" -le 4 ]; then
              IS_LIVE="true"  # Monday 12-4 AM UTC = Sunday 8-11 PM ET night games
            fi
          fi

          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "is_live=$IS_LIVE" >> $GITHUB_OUTPUT
          echo "trigger_type=$TRIGGER_TYPE" >> $GITHUB_OUTPUT

          echo "📊 Update Context:"
          echo "  Week: $WEEK"
          echo "  Is Live: $IS_LIVE"
          echo "  Trigger: $TRIGGER_TYPE"
          echo "  Time: $(date -u)"
          echo "  Day: $CURRENT_DAY ($(date -u +%A))"
          echo "  Hour: $CURRENT_HOUR UTC"
          echo "  Month: $CURRENT_MONTH"

      - name: Run live odds snapshot
        run: |
          WEEK="${{ steps.determine-context.outputs.week }}"
          IS_LIVE="${{ steps.determine-context.outputs.is_live }}"
          TRIGGER_TYPE="${{ steps.determine-context.outputs.trigger_type }}"

          echo "🚀 Starting live odds snapshot..."
          echo "  Week: $WEEK"
          echo "  Live Mode: $IS_LIVE"
          echo "  Trigger: $TRIGGER_TYPE"
          echo "  Using Production API: https://gauntlet-website.vercel.app"

          if [ "$IS_LIVE" = "true" ]; then
            echo "⚡ Capturing LIVE snapshot with current scores..."
            pnpm --filter @gauntlet/server live-snapshot
          else
            echo "📅 Capturing pre-game snapshot..."
            pnpm --filter @gauntlet/server live-snapshot
          fi

      - name: Report completion
        if: always()
        run: |
          WEEK="${{ steps.determine-context.outputs.week }}"
          IS_LIVE="${{ steps.determine-context.outputs.is_live }}"
          STATUS="${{ job.status }}"

          echo "✅ Odds update completed!"
          echo "  Week: $WEEK"
          echo "  Live Mode: $IS_LIVE"
          echo "  Status: $STATUS"
          echo "  Completed: $(date -u)"
