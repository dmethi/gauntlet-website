name: Quality Gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    name: Coverage - ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - '@gauntlet/web'
          - '@gauntlet/server'
          - '@gauntlet/sim-engine'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm before Node so `cache: 'pnpm'` can find the store. Version comes
      # from `packageManager` in the root package.json — see ci.yml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 18: @vitejs/plugin-react v5 is ESM-only and vitest.config.ts
          # loads it through require(), which only works on Node >= 22.12.
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve through `main: dist/index.js`, which
      # `pnpm install` does not produce. Without this, @gauntlet/web test
      # files that import @gauntlet/lib or @gauntlet/ui fail to resolve. It
      # passes locally only because everyone already has a dist/ lying around.
      # `^...` builds the matrix package's dependencies, not the package.
      - name: Build workspace dependencies
        run: pnpm turbo run build --filter="${{ matrix.package }}^..."

      - name: Run coverage with thresholds
        run: pnpm --filter "${{ matrix.package }}" test:coverage
