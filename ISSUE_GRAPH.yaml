# Agents MUST consult this file before starting work.
#
# How to use:
#   1. Check `current_layer` to see what's active
#   2. Pick any `pending` issue from the current layer
#   3. Set status to `in_progress` when you begin
#   4. Set status to `done` when complete (and close GitHub issue)
#   5. When all issues in a layer are `done`, increment `current_layer`
